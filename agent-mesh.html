<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BörsPulsen — Agent Mesh</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; color: #e0e0e0; font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, monospace; overflow: hidden; height: 100vh; }

  /* TOP BAR */
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; border-bottom: 1px solid #1a1a1a; background: #050505; position: relative; z-index: 10; }
  .topbar-left { display: flex; align-items: center; gap: 16px; }
  .brand { font-size: 11px; font-weight: 700; letter-spacing: 2px; color: #fff; text-transform: uppercase; }
  .brand span { color: #22d3ee; }
  .mesh-label { font-size: 10px; color: #444; letter-spacing: 1.5px; }
  .topbar-stats { display: flex; gap: 28px; }
  .stat { text-align: center; }
  .stat-val { font-size: 18px; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
  .stat-lbl { font-size: 9px; color: #555; letter-spacing: 1px; text-transform: uppercase; margin-top: 1px; }
  .stat-val.green { color: #4ade80; }
  .stat-val.cyan { color: #22d3ee; }
  .stat-val.yellow { color: #facc15; }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .btn-pause { background: #1a1a1a; border: 1px solid #333; color: #aaa; padding: 5px 14px; border-radius: 4px; font-size: 10px; font-family: inherit; cursor: pointer; letter-spacing: 1px; transition: all 0.2s; }
  .btn-pause:hover { border-color: #22d3ee; color: #22d3ee; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(74,222,128,0.4)} 50%{opacity:0.7;box-shadow:0 0 0 6px rgba(74,222,128,0)} }

  /* MAIN LAYOUT */
  .main { display: flex; height: calc(100vh - 48px); }

  /* CANVAS */
  #meshCanvas { flex: 1; cursor: default; }

  /* INSPECTOR */
  .inspector { width: 280px; border-left: 1px solid #1a1a1a; background: #050505; display: flex; flex-direction: column; flex-shrink: 0; }
  .inspector-header { padding: 14px 16px; border-bottom: 1px solid #1a1a1a; }
  .inspector-label { font-size: 9px; color: #444; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 10px; }
  .inspector-name { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 2px; }
  .inspector-role { font-size: 11px; color: #555; }
  .inspector-status { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; }
  .status-dot.active { background: #4ade80; box-shadow: 0 0 8px #4ade80; }
  .status-dot.idle   { background: #facc15; }
  .status-dot.skill  { background: #22d3ee; }
  .status-text { font-size: 10px; color: #888; letter-spacing: 0.5px; }

  .inspector-metrics { padding: 14px 16px; border-bottom: 1px solid #1a1a1a; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .metric { background: #0a0a0a; border-radius: 6px; padding: 10px; }
  .metric-val { font-size: 15px; font-weight: 700; color: #fff; }
  .metric-lbl { font-size: 9px; color: #555; margin-top: 2px; letter-spacing: 0.5px; }

  .inspector-connections { padding: 14px 16px; border-bottom: 1px solid #1a1a1a; flex: 1; overflow-y: auto; }
  .conn-label { font-size: 9px; color: #444; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px; }
  .conn-item { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid #0d0d0d; font-size: 11px; color: #666; }
  .conn-item:last-child { border-bottom: none; }
  .conn-dot { width: 5px; height: 5px; border-radius: 50%; background: #22d3ee; flex-shrink: 0; }

  .inspector-tools { padding: 14px 16px; }
  .tool-label { font-size: 9px; color: #444; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px; }
  .tool-tag { display: inline-block; background: #111; border: 1px solid #222; border-radius: 4px; padding: 3px 8px; font-size: 10px; color: #666; margin: 2px; }

  .inspector-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; color: #333; font-size: 11px; text-align: center; gap: 8px; padding: 20px; }

  /* EVENT LOG */
  .eventlog { border-top: 1px solid #1a1a1a; background: #030303; padding: 8px 16px; height: 90px; overflow: hidden; }
  .eventlog-label { font-size: 9px; color: #333; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 6px; }
  .log-line { font-size: 10px; color: #444; line-height: 1.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .log-line .log-time { color: #2a2a2a; margin-right: 8px; }
  .log-line .log-type { margin-right: 8px; }
  .log-line .log-type.task { color: #6366f1; }
  .log-line .log-type.result { color: #22d3ee; }
  .log-line .log-type.data { color: #4ade80; }
  .log-line .log-type.route { color: #facc15; }
  .log-line .log-msg { color: #555; }

  /* BOTTOM BAR */
  .bottombar { display: flex; align-items: center; justify-content: space-between; padding: 5px 16px; border-top: 1px solid #111; background: #030303; font-size: 9px; color: #333; letter-spacing: 0.5px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div>
      <div class="brand">Börs<span>Pulsen</span></div>
      <div class="mesh-label">AGENT MESH / mission control</div>
    </div>
    <div class="live-dot"></div>
  </div>
  <div class="topbar-stats">
    <div class="stat"><div class="stat-val cyan" id="statTokens">0</div><div class="stat-lbl">Tokens/m</div></div>
    <div class="stat"><div class="stat-val" id="statLatency">0ms</div><div class="stat-lbl">Latency</div></div>
    <div class="stat"><div class="stat-val green" id="statThrough">0</div><div class="stat-lbl">Throughput</div></div>
    <div class="stat"><div class="stat-val yellow" id="statQueue">0</div><div class="stat-lbl">Queue</div></div>
    <div class="stat"><div class="stat-val" id="statMsgs">0</div><div class="stat-lbl">Msgs</div></div>
    <div class="stat"><div class="stat-val cyan">27</div><div class="stat-lbl">Agents</div></div>
  </div>
  <div class="topbar-right">
    <button class="btn-pause" id="pauseBtn">⏸ PAUSE</button>
  </div>
</div>

<div class="main">
  <canvas id="meshCanvas"></canvas>

  <div class="inspector" id="inspector">
    <div class="inspector-empty" id="inspectorEmpty">
      <div style="font-size:24px;opacity:0.3">⬡</div>
      <div>Klicka på en agent för att inspektera</div>
    </div>
    <div id="inspectorContent" style="display:none; display:flex; flex-direction:column; height:100%;">
      <div class="inspector-header">
        <div class="inspector-label">INSPECTOR</div>
        <div class="inspector-name" id="iName">—</div>
        <div class="inspector-role" id="iRole">—</div>
        <div class="inspector-status">
          <div class="status-dot active" id="iStatusDot"></div>
          <div class="status-text" id="iStatus">ACTIVE</div>
        </div>
      </div>
      <div class="inspector-metrics">
        <div class="metric"><div class="metric-val" id="iLoad">—</div><div class="metric-lbl">LOAD</div></div>
        <div class="metric"><div class="metric-val" id="iLatency">—</div><div class="metric-lbl">LATENCY</div></div>
        <div class="metric"><div class="metric-val" id="iMsgs">—</div><div class="metric-lbl">MSGS</div></div>
        <div class="metric"><div class="metric-val" id="iRate">—</div><div class="metric-lbl">RATE/s</div></div>
      </div>
      <div class="inspector-connections" style="flex:1;overflow-y:auto">
        <div class="conn-label">CONNECTED TO</div>
        <div id="iConnections"></div>
      </div>
      <div class="inspector-tools">
        <div class="tool-label">VERKTYG</div>
        <div id="iTools"></div>
      </div>
    </div>
  </div>
</div>

<div class="eventlog">
  <div class="eventlog-label">EVENT LOG</div>
  <div id="logLines"></div>
</div>

<div class="bottombar">
  <span>KLICKA PÅ EN NOD FÖR ATT INSPEKTERA</span>
  <span id="linkCount">— LINKS</span>
  <span id="agentCount">27 AGENTS</span>
</div>

<script>
const canvas = document.getElementById('meshCanvas');
const ctx = canvas.getContext('2d');
let paused = false;
let selectedNode = null;
let animFrame = 0;
let particles = [];

// ── AGENT DEFINITIONS ─────────────────────────────────────────────────────────
const AGENTS = [
  // Orkestratorn i mitten
  { id: 'oversikt',    name: 'BörsPulsen',   role: 'oversikt / koordinator',  type: 'core',    tools: ['All tools'], color: '#22d3ee' },

  // Backend-lager
  { id: 'api',         name: 'API-Functions', role: 'netlify serverless',      type: 'backend', tools: ['Read','Edit','Write','Grep','Glob','Bash'], color: '#6366f1' },
  { id: 'market',      name: 'Market Data',   role: 'nyckeltal & kurs-analys', type: 'backend', tools: ['Read','Grep','Glob','Bash','WebFetch'], color: '#6366f1' },
  { id: 'release',     name: 'Release Verifier', role: 'säkerhet & deploy',   type: 'backend', tools: ['Read','Grep','Glob','Bash'], color: '#6366f1' },

  // Frontend
  { id: 'frontend',    name: 'Frontend Eng', role: 'index.html / vanilla JS', type: 'frontend', tools: ['Read','Edit','Write','Grep','Glob','Bash'], color: '#a78bfa' },
  { id: 'design',      name: 'Design Critic', role: 'UI / premium-känsla',    type: 'frontend', tools: ['Read','Grep','Glob','Skill'], color: '#a78bfa' },

  // Sektors-agenter
  { id: 'tech',        name: 'Tech',          role: 'Ericsson, Hexagon, Evo',  type: 'sector', tools: ['All tools'], color: '#34d399' },
  { id: 'finans',      name: 'Finans',        role: 'SEB, Nordea, Investor',   type: 'sector', tools: ['All tools'], color: '#34d399' },
  { id: 'industri',    name: 'Industri',      role: 'Volvo, Atlas, Sandvik',   type: 'sector', tools: ['All tools'], color: '#34d399' },
  { id: 'energi',      name: 'Energi',        role: 'Equinor, Aker BP',        type: 'sector', tools: ['All tools'], color: '#34d399' },
  { id: 'halsa',       name: 'Hälsa',         role: 'Getinge, AstraZeneca',    type: 'sector', tools: ['All tools'], color: '#34d399' },
  { id: 'konsument',   name: 'Konsument',     role: 'H&M, Axfood, Amazon',     type: 'sector', tools: ['All tools'], color: '#34d399' },
  { id: 'material',    name: 'Material',      role: 'SSAB, Boliden, Hexpol',   type: 'sector', tools: ['All tools'], color: '#34d399' },

  // Skills
  { id: 'brandkit',    name: 'Brandkit',      role: 'brand image generation',  type: 'skill', tools: ['Skill'], color: '#f59e0b' },
  { id: 'design-taste','name': 'Design Taste', role: 'frontend taste v1/v2',   type: 'skill', tools: ['Skill'], color: '#f59e0b' },
  { id: 'high-end',    name: 'High-End Visual', role: 'premium visual design', type: 'skill', tools: ['Skill'], color: '#f59e0b' },
  { id: 'image-code',  name: 'Image→Code',    role: 'screenshot to code',      type: 'skill', tools: ['Skill'], color: '#f59e0b' },
  { id: 'img-web',     name: 'Imagegen Web',  role: 'web image generation',    type: 'skill', tools: ['Skill'], color: '#f59e0b' },
  { id: 'img-mob',     name: 'Imagegen Mobile','role': 'mobile image gen',     type: 'skill', tools: ['Skill'], color: '#f59e0b' },
  { id: 'brutalist',   name: 'Brutalist UI',  role: 'industrial design',       type: 'skill', tools: ['Skill'], color: '#f59e0b' },
  { id: 'minimalist',  name: 'Minimalist UI', role: 'clean & minimal',         type: 'skill', tools: ['Skill'], color: '#f59e0b' },
  { id: 'redesign',    name: 'Redesign',      role: 'existing project redesign',type: 'skill', tools: ['Skill'], color: '#f59e0b' },
  { id: 'stitch',      name: 'Stitch Taste',  role: 'stitch design system',    type: 'skill', tools: ['Skill'], color: '#f59e0b' },
  { id: 'gpt-taste',   name: 'GPT Taste',     role: 'gpt-style design',        type: 'skill', tools: ['Skill'], color: '#f59e0b' },
  { id: 'full-output', name: 'Full Output',   role: 'output enforcement',      type: 'skill', tools: ['Skill'], color: '#f59e0b' },
];

// ── CONNECTIONS ──────────────────────────────────────────────────────────────
const LINKS = [
  // Orkestratorn → alla lager
  ['oversikt','api'], ['oversikt','market'], ['oversikt','release'],
  ['oversikt','frontend'], ['oversikt','design'],
  ['oversikt','tech'], ['oversikt','finans'], ['oversikt','industri'],
  ['oversikt','energi'], ['oversikt','halsa'], ['oversikt','konsument'], ['oversikt','material'],
  // Backend-interna
  ['api','market'], ['api','release'],
  // Frontend → skills
  ['frontend','brandkit'], ['frontend','design-taste'], ['frontend','high-end'],
  ['frontend','image-code'], ['frontend','img-web'], ['frontend','img-mob'],
  ['frontend','brutalist'], ['frontend','minimalist'], ['frontend','redesign'],
  ['frontend','stitch'], ['frontend','gpt-taste'], ['frontend','full-output'],
  ['design','high-end'], ['design','stitch'], ['design','minimalist'],
  // Sektorer → market data
  ['tech','market'], ['finans','market'], ['industri','market'],
  ['energi','market'], ['halsa','market'], ['konsument','market'], ['material','market'],
];

// ── POSITIONS (beräknas när canvas-storlek är känd) ──────────────────────────
function calcPositions(W, H) {
  const cx = W / 2, cy = H / 2;
  const pos = {};

  // Orkestratorn i mitten
  pos['oversikt'] = { x: cx, y: cy };

  // Backend-ring (kl 11, 1, 3)
  const backendAngles = [-Math.PI*0.55, -Math.PI*0.25, 0];
  const backendR = Math.min(W, H) * 0.28;
  ['api','market','release'].forEach((id, i) => {
    pos[id] = { x: cx + Math.cos(backendAngles[i]) * backendR, y: cy + Math.sin(backendAngles[i]) * backendR };
  });

  // Frontend-ring (kl 8, 10)
  const frontendAngles = [-Math.PI*0.75, -Math.PI*0.9];
  const frontendR = Math.min(W, H) * 0.28;
  ['frontend','design'].forEach((id, i) => {
    pos[id] = { x: cx + Math.cos(frontendAngles[i]) * frontendR, y: cy + Math.sin(frontendAngles[i]) * frontendR };
  });

  // Sektorer (nedre halvcirkel)
  const sectors = ['tech','finans','industri','energi','halsa','konsument','material'];
  const sectorR = Math.min(W, H) * 0.3;
  sectors.forEach((id, i) => {
    const angle = Math.PI * 0.15 + (Math.PI * 0.7 / (sectors.length - 1)) * i;
    pos[id] = { x: cx + Math.cos(angle) * sectorR, y: cy + Math.sin(angle) * sectorR };
  });

  // Skills (yttre ring, vänster sida)
  const skills = ['brandkit','design-taste','high-end','image-code','img-web','img-mob','brutalist','minimalist','redesign','stitch','gpt-taste','full-output'];
  const skillR = Math.min(W, H) * 0.42;
  skills.forEach((id, i) => {
    const angle = -Math.PI * 1.15 + (Math.PI * 0.8 / (skills.length - 1)) * i;
    pos[id] = { x: cx + Math.cos(angle) * skillR, y: cy + Math.sin(angle) * skillR };
  });

  return pos;
}

let positions = {};
let nodeStates = {};

function initNodeStates() {
  AGENTS.forEach(a => {
    nodeStates[a.id] = {
      load: Math.random() * 80 + 10,
      latency: Math.floor(Math.random() * 400 + 50),
      msgs: Math.floor(Math.random() * 2000 + 100),
      rate: (Math.random() * 12 + 0.5).toFixed(1),
      activity: Math.random(),
    };
  });
}
initNodeStates();

// ── RESIZE ───────────────────────────────────────────────────────────────────
function resize() {
  const W = canvas.offsetWidth;
  const H = canvas.parentElement.offsetHeight - 90; // minus eventlog
  canvas.width = W;
  canvas.height = H;
  positions = calcPositions(W, H);
}
window.addEventListener('resize', resize);
setTimeout(resize, 10);

// ── DRAW ─────────────────────────────────────────────────────────────────────
function drawNode(agent, x, y, selected) {
  const st = nodeStates[agent.id];
  const w = agent.id === 'oversikt' ? 130 : 110;
  const h = agent.id === 'oversikt' ? 56 : 44;
  const r = 6;

  // Glow om selected
  if (selected) {
    ctx.shadowColor = agent.color;
    ctx.shadowBlur = 20;
  }

  // Box
  ctx.beginPath();
  ctx.roundRect(x - w/2, y - h/2, w, h, r);
  ctx.fillStyle = selected ? '#0d1117' : '#080808';
  ctx.fill();
  ctx.strokeStyle = selected ? agent.color : '#1a1a1a';
  ctx.lineWidth = selected ? 1.5 : 0.8;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Aktivitets-bar
  const barW = (w - 16) * Math.max(0.05, st.activity);
  ctx.fillStyle = agent.color + '33';
  ctx.fillRect(x - w/2 + 8, y + h/2 - 7, w - 16, 3);
  ctx.fillStyle = agent.color;
  ctx.fillRect(x - w/2 + 8, y + h/2 - 7, barW, 3);

  // Status-dot
  ctx.beginPath();
  ctx.arc(x - w/2 + 10, y - h/2 + 10, 3, 0, Math.PI * 2);
  ctx.fillStyle = agent.type === 'skill' ? '#f59e0b' : (st.activity > 0.5 ? '#4ade80' : '#facc15');
  ctx.fill();

  // Namn
  ctx.fillStyle = selected ? '#fff' : '#ccc';
  ctx.font = `${agent.id === 'oversikt' ? 600 : 500} ${agent.id === 'oversikt' ? 12 : 11}px "SF Mono", ui-monospace, monospace`;
  ctx.textAlign = 'center';
  ctx.fillText(agent.name, x, y - 4);

  // Roll
  ctx.fillStyle = '#444';
  ctx.font = '9px "SF Mono", ui-monospace, monospace';
  ctx.fillText(agent.role.length > 18 ? agent.role.slice(0, 17) + '…' : agent.role, x, y + 10);
}

function drawLink(x1, y1, x2, y2, color, alpha) {
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.strokeStyle = color + Math.floor(alpha * 255).toString(16).padStart(2, '0');
  ctx.lineWidth = 0.6;
  ctx.stroke();
}

// Partiklar som rör sig längs linjer
function spawnParticle() {
  if (particles.length > 80) return;
  const link = LINKS[Math.floor(Math.random() * LINKS.length)];
  const [fromId, toId] = Math.random() > 0.5 ? link : [link[1], link[0]];
  const from = positions[fromId];
  const to = positions[toId];
  if (!from || !to) return;
  const agent = AGENTS.find(a => a.id === fromId);
  particles.push({ from, to, t: 0, speed: 0.008 + Math.random() * 0.012, color: agent ? agent.color : '#22d3ee' });
}

function draw() {
  if (!canvas.width) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Linjer
  LINKS.forEach(([a, b]) => {
    const pa = positions[a], pb = positions[b];
    if (!pa || !pb) return;
    const agentA = AGENTS.find(x => x.id === a);
    const isSelectedLink = selectedNode && (selectedNode.id === a || selectedNode.id === b);
    drawLink(pa.x, pa.y, pb.x, pb.y, agentA ? agentA.color : '#22d3ee', isSelectedLink ? 0.25 : 0.08);
  });

  // Partiklar
  particles.forEach(p => {
    const px = p.from.x + (p.to.x - p.from.x) * p.t;
    const py = p.from.y + (p.to.y - p.from.y) * p.t;
    ctx.beginPath();
    ctx.arc(px, py, 2, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = 1 - Math.abs(p.t - 0.5) * 1.5;
    ctx.fill();
    ctx.globalAlpha = 1;
  });

  // Noder
  AGENTS.forEach(agent => {
    const p = positions[agent.id];
    if (!p) return;
    drawNode(agent, p.x, p.y, selectedNode && selectedNode.id === agent.id);
  });

  animFrame++;
}

function tick() {
  if (!paused) {
    // Flytta partiklar
    particles = particles.filter(p => p.t < 1);
    particles.forEach(p => { p.t += p.speed; });
    if (animFrame % 12 === 0) spawnParticle();

    // Uppdatera node-aktivitet
    if (animFrame % 30 === 0) {
      AGENTS.forEach(a => {
        nodeStates[a.id].activity = Math.max(0.05, Math.min(1, nodeStates[a.id].activity + (Math.random() - 0.48) * 0.15));
      });
    }
    draw();
    updateStats();
  }
  requestAnimationFrame(tick);
}

// ── STATS ─────────────────────────────────────────────────────────────────────
let statTokens = 180, statLatency = 320, statThrough = 22, statQueue = 3, statMsgs = 1240;
function updateStats() {
  if (animFrame % 45 !== 0) return;
  statTokens  = Math.max(50, statTokens  + Math.floor((Math.random()-0.45)*30));
  statLatency = Math.max(80, statLatency + Math.floor((Math.random()-0.5)*60));
  statThrough = Math.max(5,  statThrough + Math.floor((Math.random()-0.45)*5));
  statQueue   = Math.max(0,  Math.floor(Math.random()*8));
  statMsgs   += Math.floor(Math.random()*8);
  document.getElementById('statTokens').textContent  = statTokens;
  document.getElementById('statLatency').textContent = statLatency + 'ms';
  document.getElementById('statThrough').textContent = statThrough;
  document.getElementById('statQueue').textContent   = statQueue;
  document.getElementById('statMsgs').textContent    = statMsgs;

  // Uppdatera metrics för vald nod
  if (selectedNode) updateInspector(selectedNode);
}

// ── EVENT LOG ─────────────────────────────────────────────────────────────────
const LOG_MSGS = [
  ['task',   'Hämtar kurs för ERIC-B via Finnhub'],
  ['result', 'P/E beräknat: 22.4 — returnerat till frontend'],
  ['data',   'Nyckeltal uppdaterade: Tech-sektor +3 aktier'],
  ['route',  'Sektoranalys delegerad → Industri-agent'],
  ['task',   'AI-djupanalys av Volvo B startad'],
  ['result', 'Bull/Bear genererat på 1.2s'],
  ['data',   'Valutakurs EUR/SEK hämtad via Frankfurter'],
  ['route',  'Design-granskning delegerad → Design Critic'],
  ['task',   'Screener-filter körs: P/E < 15, yield > 3%'],
  ['result', '12 aktier matchar screener-kriterierna'],
  ['data',   'Insider-affär: Volvo-chef köpte 50k aktier'],
  ['route',  'Release-check → inga läckta nycklar hittade'],
  ['task',   'AI-analys för Hexagon B → läge: Värdering'],
  ['result', 'Nyhetsradar: Ericsson nämndes i 4 artiklar'],
  ['data',   'Utdelningskalender uppdaterad: Nordea ex-dag 15 aug'],
];
let logIdx = 0;
function addLog() {
  const [type, msg] = LOG_MSGS[logIdx % LOG_MSGS.length];
  logIdx++;
  const now = new Date();
  const t = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
  const container = document.getElementById('logLines');
  const line = document.createElement('div');
  line.className = 'log-line';
  line.innerHTML = `<span class="log-time">${t}</span><span class="log-type ${type}">${type.toUpperCase()}</span><span class="log-msg">${msg}</span>`;
  container.insertBefore(line, container.firstChild);
  while (container.children.length > 4) container.removeChild(container.lastChild);
}
setInterval(addLog, 2200);

// ── INSPECTOR ─────────────────────────────────────────────────────────────────
function updateInspector(agent) {
  const st = nodeStates[agent.id];
  document.getElementById('inspectorEmpty').style.display = 'none';
  document.getElementById('inspectorContent').style.display = 'flex';

  document.getElementById('iName').textContent = agent.name;
  document.getElementById('iRole').textContent = agent.role;
  const dot = document.getElementById('iStatusDot');
  dot.className = 'status-dot ' + (agent.type === 'skill' ? 'skill' : (st.activity > 0.5 ? 'active' : 'idle'));
  document.getElementById('iStatus').textContent = agent.type === 'skill' ? 'SKILL' : (st.activity > 0.5 ? 'ACTIVE' : 'IDLE');
  document.getElementById('iLoad').textContent    = Math.round(st.activity * 100) + '%';
  document.getElementById('iLatency').textContent = st.latency + 'ms';
  document.getElementById('iMsgs').textContent    = st.msgs;
  document.getElementById('iRate').textContent    = st.rate;

  // Connections
  const conns = LINKS.filter(([a,b]) => a === agent.id || b === agent.id)
    .map(([a,b]) => a === agent.id ? b : a);
  const connEl = document.getElementById('iConnections');
  connEl.innerHTML = conns.map(id => {
    const a = AGENTS.find(x => x.id === id);
    return `<div class="conn-item"><div class="conn-dot" style="background:${a?.color||'#22d3ee'}"></div>${a?.name || id}</div>`;
  }).join('');

  // Tools
  const toolEl = document.getElementById('iTools');
  toolEl.innerHTML = agent.tools.map(t => `<span class="tool-tag">${t}</span>`).join('');
}

// ── CLICK ─────────────────────────────────────────────────────────────────────
canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  let found = null;
  AGENTS.forEach(agent => {
    const p = positions[agent.id];
    if (!p) return;
    const w = agent.id === 'oversikt' ? 130 : 110;
    const h = agent.id === 'oversikt' ? 56 : 44;
    if (mx >= p.x - w/2 && mx <= p.x + w/2 && my >= p.y - h/2 && my <= p.y + h/2) found = agent;
  });
  if (found) {
    selectedNode = found;
    updateInspector(found);
  } else {
    selectedNode = null;
    document.getElementById('inspectorEmpty').style.display = 'flex';
    document.getElementById('inspectorContent').style.display = 'none';
  }
});

// ── PAUSE ─────────────────────────────────────────────────────────────────────
document.getElementById('pauseBtn').addEventListener('click', function() {
  paused = !paused;
  this.textContent = paused ? '▶ RESUME' : '⏸ PAUSE';
});

// ── LINK COUNT ────────────────────────────────────────────────────────────────
document.getElementById('linkCount').textContent = LINKS.length + ' LINKS';

// ── START ─────────────────────────────────────────────────────────────────────
tick();
</script>
